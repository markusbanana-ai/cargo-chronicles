name: Update news

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC), at 17 minutes past
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch news and market data
        run: python scripts/update.py

      - name: Save changes
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
